name: prototype_app
description: BLE prototype app for ESP32 hardware integration.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.31.0   # BLE core — scan, connect, read/write
  permission_handler: ^11.0.0  # Runtime permissions for Android BLE
  provider: ^6.1.0             # Lightweight state management

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

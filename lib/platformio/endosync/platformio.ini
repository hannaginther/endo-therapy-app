; EndoSync firmware — PlatformIO project configuration
; Board: Arduino Nano ESP32 (ABX00083)
; Flash: PlatformIO Upload button or `pio run --target upload`
; Monitor: PlatformIO Serial Monitor at 115200 baud

[env:arduino_nano_esp32]
platform  = espressif32
board     = arduino_nano_esp32
framework = arduino

; Pin alias support (D0–D12, A0–A7) matches Arduino Nano ESP32 silk-screen labels
board_build.arduino.upstream_packages = no

monitor_speed = 115200

lib_deps =
    arduino-libraries/ArduinoBLE
    adafruit/Adafruit MCP9808 Library
    adafruit/Adafruit DRV2605 Library
    adafruit/Adafruit BusIO
